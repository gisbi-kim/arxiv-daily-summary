name: arXiv Daily Summary

on:
  schedule:
    # 15:00 KST every day
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto, daily, backfill, weekly, or sunday"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - daily
          - backfill
          - weekly
          - sunday
      target_date:
        description: "Optional target date for backfill/daily, in YYYY-MM-DD"
        required: false
        type: string
      send_slack:
        description: "Send Slack notification through SLACK_WEBHOOK_URL if configured"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: arxiv-daily-summary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    name: Run arXiv Daily Briefing
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WORKDIR: ${{ github.workspace }}
      GITHUB_REPO: gisbi-kim/arxiv-daily-summary
      SITE_URL: https://gisbi-kim.github.io/arxiv-daily-summary
      SLACK_CHANNEL: "#arxiv-daily-summary"
      SLACK_CHANNEL_ID: C0ASYHPULFM
      MODE: ${{ github.event.inputs.mode || 'auto' }}
      TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
      SEND_SLACK: ${{ github.event.inputs.send_slack || 'true' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANTHROPIC_API_KEY}" ]]; then
            echo "::error::Missing required repository secret ANTHROPIC_API_KEY. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [[ -z "${SLACK_WEBHOOK_URL}" ]]; then
            echo "::warning::SLACK_WEBHOOK_URL is not configured. The workflow can update GitHub Pages, but Slack delivery will be skipped."
          fi

      - name: Install Claude Code CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Prepare run prompt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > out/ci_prompt.md <<'EOF'
          You are running the arXiv Daily Briefing release workflow inside GitHub Actions.

          Repository: gisbi-kim/arxiv-daily-summary
          Workdir: ${WORKDIR}
          Site URL: ${SITE_URL}
          Slack channel: ${SLACK_CHANNEL}
          Slack channel ID: ${SLACK_CHANNEL_ID}
          Requested mode: ${MODE}
          Requested target date: ${TARGET_DATE}

          Authoritative runbook:
          - Read and follow prompts/instruction_v20260516.md.
          - Treat it as the source of truth for mode resolution, parser usage, output files, validation gates, and Slack copy.

          Non-negotiable rules:
          1. Do not use browser/WebFetch-style summarization of arXiv list pages. Use the repository parser scripts.
          2. If the requested target date is older than the current /new listing date, use Backfill mode and scripts/fetch_arxiv_pastweek_date.py for that date.
          3. For auto mode, run Calendar Audit first and fill missing weekdays in chronological order.
          4. Generate or update all required artifacts: posts, trends, benchmarks, insights, weekly when applicable, feed.xml, index.html/stat artifacts when required by the repo.
          5. Run the repo validation/release gates described in the instruction file, including JSON load checks, feed check, date/listing-source checks, duplicate/stale daily checks, phylogeny-tag checks, geometry/SLAM/reconstruction coverage checks, and git diff checks.
          6. Commit and push only if the release gates pass.
          7. After successful release, write the Slack message body to out/slack_message.txt. Do not call Slack directly from Claude Code.
          8. After successful release, write a one-line success marker to out/release_ok.txt.
          9. If there is intentionally no release, for example Sunday skip with no missing daily, write a short explanation to out/no_release.txt and write the Slack/no-op message to out/slack_message.txt.
          10. If any required gate fails, do not fabricate success, do not commit partial outputs, and exit non-zero with a clear reason.

          Git settings to use if a commit is needed:
          - user.name: arxiv-daily-bot
          - user.email: actions@github.com

          Suggested high-level command flow, adapted as needed by the runbook:
          - git pull --ff-only origin main
          - mkdir -p out
          - resolve execution_date, listing_date, post_date, weekly_date
          - run fetch_arxiv.py or fetch_arxiv_pastweek_date.py according to mode
          - run classify.py and generation/validation scripts
          - run build_feed.py and build_feed.py --check
          - run validate_daily_release.py --date YYYY-MM-DD when applicable
          - inspect git diff
          - commit and push only after all gates pass
          EOF
          python - <<'PY'
          from pathlib import Path
          import os
          p = Path('out/ci_prompt.md')
          text = p.read_text(encoding='utf-8')
          for key in ['WORKDIR', 'SITE_URL', 'SLACK_CHANNEL', 'SLACK_CHANNEL_ID', 'MODE', 'TARGET_DATE']:
              text = text.replace('${' + key + '}', os.environ.get(key, ''))
          p.write_text(text, encoding='utf-8')
          PY

      - name: Run Claude Code release agent
        shell: bash
        run: |
          set -euo pipefail
          claude -p "$(cat out/ci_prompt.md)" --dangerously-skip-permissions

      - name: Finalize commit and push if Claude left validated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "arxiv-daily-bot"
          git config user.email "actions@github.com"

          if [[ -f out/release_ok.txt ]]; then
            echo "Release marker found. Ensuring validated changes are pushed."
            git add posts trends benchmarks insights weekly feed.xml index.html out || true
            if git diff --cached --quiet; then
              echo "No staged changes remain; assuming Claude already committed/pushed or release was metadata-only."
            else
              DATE_TAG="${TARGET_DATE:-$(date +%F)}"
              git commit -m "Update arXiv daily summary (${DATE_TAG})"
              git push origin HEAD:main
            fi
          elif [[ -f out/no_release.txt ]]; then
            echo "No-release marker found."
            cat out/no_release.txt
          else
            echo "::error::Neither out/release_ok.txt nor out/no_release.txt exists. Treating run as failed."
            exit 1
          fi

      - name: Send Slack notification
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${SEND_SLACK}" != "true" ]]; then
            echo "Slack delivery disabled by workflow input."
            exit 0
          fi
          if [[ -z "${SLACK_WEBHOOK_URL}" ]]; then
            echo "SLACK_WEBHOOK_URL is not configured; skipping Slack delivery."
            exit 0
          fi

          if [[ -f out/slack_message.txt ]]; then
            MESSAGE="$(cat out/slack_message.txt)"
          elif [[ "${{ job.status }}" == "success" ]]; then
            MESSAGE="arXiv Daily Summary workflow finished. Site: ${SITE_URL}"
          else
            MESSAGE="arXiv Daily Summary workflow failed. Check GitHub Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi

          python - <<'PY'
          import json, os
          msg = os.environ.get('MESSAGE', '')
          with open('out/slack_payload.json', 'w', encoding='utf-8') as f:
              json.dump({'text': msg}, f, ensure_ascii=False)
          PY
          curl -X POST -H 'Content-type: application/json' --data @out/slack_payload.json "${SLACK_WEBHOOK_URL}"

      - name: Upload run artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: arxiv-daily-summary-run-${{ github.run_id }}
          path: |
            out/*.json
            out/*.txt
            out/*.md
          if-no-files-found: ignore
